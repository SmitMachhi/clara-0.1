# fly.toml configuration for Morning Clarity Journal
# NOTE: Single-machine deployment required due to in-memory sessions (client-side encryption)

app = "clara-0-1"
primary_region = "yyz"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  NODE_OPTIONS = "--max-old-space-size=140 --optimize-for-size"
  UV_THREADPOOL_SIZE = "4"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 20

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "journal_data"
  destination = "/data"
